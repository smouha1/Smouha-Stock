name: Build Smouha Stock APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble Release APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Write local.properties (Android SDK on runner)
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            echo "ANDROID_HOME not found on runner"
            exit 1
          fi
          echo "sdk.dir=$SDK" > local.properties
          echo "Using Android SDK: $SDK"

      - name: Accept licenses & install platform 34
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SMGR=""
          for c in \
            "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK/cmdline-tools/bin/sdkmanager" \
            "$(find "$SDK/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -1)"
          do
            if [ -x "$c" ]; then SMGR="$c"; break; fi
          done
          if [ -z "$SMGR" ]; then
            echo "sdkmanager not found under $SDK"
            exit 1
          fi
          yes | "$SMGR" --licenses >/dev/null || true
          "$SMGR" "platforms;android-34" "build-tools;34.0.0"

      - name: Create CI release keystore
        run: |
          mkdir -p /tmp/smouha-keys
          keytool -genkeypair -v \
            -keystore /tmp/smouha-keys/smouha-release.jks \
            -storetype PKCS12 \
            -storepass "${SMOUHA_KEYSTORE_PASS:-SmouhaOps2026#Key}" \
            -keypass "${SMOUHA_KEY_PASS:-SmouhaOps2026#Key}" \
            -alias "${SMOUHA_KEY_ALIAS:-smouha_release_key}" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Smouha Stock Terminal, OU=Logistics Engineering, O=Smouha DS60, L=Alexandria, ST=Alexandria, C=EG"
          ls -la /tmp/smouha-keys/smouha-release.jks
        env:
          SMOUHA_KEYSTORE_PASS: ${{ secrets.SMOUHA_KEYSTORE_PASS }}
          SMOUHA_KEY_PASS: ${{ secrets.SMOUHA_KEY_PASS }}
          SMOUHA_KEY_ALIAS: ${{ secrets.SMOUHA_KEY_ALIAS }}

      - name: Assemble release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace --warning-mode all
        env:
          SMOUHA_KEYSTORE_PASS: ${{ secrets.SMOUHA_KEYSTORE_PASS }}
          SMOUHA_KEY_PASS: ${{ secrets.SMOUHA_KEY_PASS }}
          SMOUHA_KEY_ALIAS: ${{ secrets.SMOUHA_KEY_ALIAS }}

      - name: List APK outputs
        run: find app/build/outputs/apk -type f -name "*.apk" -ls

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmouhaStock-release-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
